# ============================================================
#  Tmux Catppuccin Mocha Theme — Arrow Powerline
#  JetBrainsMono Nerd Font requerida
#
#  Salve em: ~/.config/tmux/mocha-theme.conf
#  No ~/.tmux.conf: source-file ~/.config/tmux/mocha-theme.conf
#  Recarregue:      tmux source ~/.tmux.conf
# ============================================================

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

set -g status on
set -g status-interval 5
set -g status-position top
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left-length 50
set -g status-left "#[bg=#cba6f7,fg=#1e1e2e,bold]  #S #[bg=#1e1e2e,fg=#cba6f7]#[default] "

set -g status-right-length 70
set -g status-right "#[bg=#1e1e2e,fg=#94e2d5,none]#[bg=#94e2d5,fg=#1e1e2e]  #(whoami) #[bg=#94e2d5,fg=#74c7ec]#[bg=#74c7ec,fg=#1e1e2e,bold]  %d/%m #[bg=#74c7ec,fg=#89b4fa]#[bg=#89b4fa,fg=#1e1e2e,bold]  %H:%M "

set -g window-status-format "#[bg=#313244,fg=#1e1e2e]#[bg=#313244,fg=#7f849c] #I:#W #[bg=#1e1e2e,fg=#313244]"
set -g window-status-current-format "#[bg=#89b4fa,fg=#1e1e2e]#[bg=#89b4fa,fg=#1e1e2e,bold] #I:#W #[bg=#1e1e2e,fg=#89b4fa]"
set -g window-status-separator ""

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

set -g mode-style "bg=#cba6f7,fg=#1e1e2e,bold"
set -g message-style "bg=#cba6f7,fg=#1e1e2e,bold"
set -g message-command-style "bg=#313244,fg=#cdd6f4"

set -g clock-mode-colour "#cba6f7"
set -g clock-mode-style 24
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
